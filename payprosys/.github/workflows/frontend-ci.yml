name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'payprosys/frontend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'payprosys/frontend/**'

defaults:
  run:
    working-directory: payprosys/frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: payprosys/frontend
          push: false
          tags: payprosys-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'payprosys/backend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'payprosys/backend/**'

defaults:
  run:
    working-directory: payprosys/backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package -DskipTests

      - name: Run tests
        run: mvn -B test

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: payprosys/backend
          push: false
          tags: payprosys-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

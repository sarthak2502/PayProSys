spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:payprosys}
    username: ${DB_USERNAME:payprosys}
    password: ${DB_PASSWORD:payprosys}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration

# Browser may use localhost or 127.0.0.1; add Vite default if you run npm dev against this API.
cors:
  allowed-origins: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173

logging:
  level:
    root: INFO
    com.payprosys: INFO

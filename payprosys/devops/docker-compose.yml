services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payprosys
      POSTGRES_USER: payprosys
      POSTGRES_PASSWORD: payprosys
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payprosys -d payprosys"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: stage
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: payprosys
      DB_USERNAME: payprosys
      DB_PASSWORD: payprosys
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
